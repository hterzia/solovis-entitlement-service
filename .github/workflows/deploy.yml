name: Deploy to Cloud Run

on:
  push:
    branches: [main]
    # Documentation changes cannot alter the image, so rebuilding and cutting a
    # new Cloud Run revision for them is pure waste — and a redeploy is not free
    # here: the revision switchover is the window where two Litestream writers
    # briefly overlap and recent writes can be lost.
    paths-ignore:
      - 'docs/**'
      - '.specs/**'
      - '**/*.md'
  workflow_dispatch:

# id-token is what makes Workload Identity Federation work: GitHub mints an OIDC
# token that GCP exchanges for short-lived credentials. The org policy
# iam.disableServiceAccountKeyCreation blocks the long-lived-JSON-key
# alternative, so this is the only available path — and the better one, since no
# credential exists to leak.
permissions:
  contents: read
  id-token: write

env:
  PROJECT_ID: entitlement-505004
  REGION: us-central1
  SERVICE: entitlement-service
  AR_REPO: entitlement
  RUNTIME_SA: entitlement-run@entitlement-505004.iam.gserviceaccount.com

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # The whole reactor. The image build skips tests, so this is the gate.
      - name: Run reactor tests
        working-directory: management/backend
        run: ./mvnw -B test

  frontend-test:
    name: Frontend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: management/frontend/management-ui/package-lock.json

      - name: Run vitest
        working-directory: management/frontend/management-ui
        run: |
          npm ci
          npm test

  deploy:
    name: Build, smoke and deploy
    needs: [test, frontend-test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/773463992355/locations/global/workloadIdentityPools/github/providers/github
          service_account: entitlement-deploy@entitlement-505004.iam.gserviceaccount.com

      - uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Build image
        run: |
          IMAGE="${REGION}-docker.pkg.dev/${PROJECT_ID}/${AR_REPO}/${SERVICE}:${GITHUB_SHA}"
          docker build -t "$IMAGE" .
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

      # Runs before the push, so an image that does not render is never published.
      #
      # This gate exists because a regression once shipped that every other check was
      # blind to: the JS bundle was served as text/html, so the browser refused it and
      # every page rendered blank — while all requests returned 200, nothing 404'd, the
      # health check stayed green, and CI passed. Status codes are not evidence the app
      # works. Only a real browser loading the real built artifact sees this class of bug.
      #
      # Litestream is bypassed here (--entrypoint java): the smoke run has no GCS
      # credentials and does not need replication to prove the UI renders.
      - name: Browser smoke test against the built image
        run: |
          docker run -d --name smoke -p 8081:8081 \
            -e ENTITLEMENT_DB_PATH=/data/smoke.db \
            -e ENTITLEMENT_SEED_ENABLED=true \
            --entrypoint java "$IMAGE" -jar /app/app.jar

          for i in $(seq 1 60); do
            curl -sf http://localhost:8081/actuator/health >/dev/null 2>&1 && break
            sleep 2
          done
          curl -sf http://localhost:8081/actuator/health >/dev/null || {
            echo "service never became healthy"; docker logs smoke | tail -50; exit 1; }

          cd deploy/smoke
          npm install --silent --no-audit --no-fund
          npx playwright install --with-deps chromium
          node smoke.mjs http://localhost:8081

      - name: Smoke failure diagnostics
        if: failure()
        run: docker logs smoke 2>&1 | tail -80 || true

      - name: Push image
        run: docker push "$IMAGE"

      # --max-instances=1 is load-bearing, not a cost control: SQLite permits one
      # writer host, so this flag makes the constraint an infrastructure
      # guarantee. It must never be raised without first replacing SQLite.
      #
      # The Gemini key goes through --set-secrets, never --set-env-vars: env vars
      # are stored as plaintext in the revision metadata and readable by anyone
      # with run.viewer, whereas --set-secrets stores only a reference and
      # resolves the value at container start. Only the runtime service account
      # holds secretAccessor on it — the deploy account this workflow
      # impersonates cannot read the key.
      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy "$SERVICE" \
            --image "$IMAGE" \
            --region "$REGION" \
            --service-account "$RUNTIME_SA" \
            --min-instances 1 \
            --max-instances 1 \
            --cpu 1 \
            --memory 1Gi \
            --port 8081 \
            --allow-unauthenticated \
            --set-env-vars "ENTITLEMENT_DB_PATH=/data/entitlement.db,LITESTREAM_BUCKET=${PROJECT_ID}-litestream,ENTITLEMENT_SEED_ENABLED=true" \
            --set-secrets "GOOGLE_AI_GEMINI_API_KEY=gemini-api-key:latest" \
            --quiet

      - name: Show service URL
        run: |
          gcloud run services describe "$SERVICE" --region "$REGION" \
            --format 'value(status.url)' >> "$GITHUB_STEP_SUMMARY"
