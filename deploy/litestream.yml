# Litestream v0.5.x configuration.
#
# Note the v0.5 syntax, which differs from the widely-circulated 0.3.x examples:
# the replica type is `gs` (not `gcs`), and `replica:` is singular rather than a
# `replicas:` list. Copying a 0.3.x snippet here will fail to parse.
#
# Credentials come from the instance metadata server — on Cloud Run, Litestream
# picks up the runtime service account automatically. This is not merely the
# preferred path: the org policy `iam.disableServiceAccountKeyCreation` makes
# the key-file alternative impossible.
#
# $LITESTREAM_BUCKET is expanded from the environment at startup.
#
# Retention is deliberately left to Litestream. Do NOT add a GCS lifecycle rule
# to this bucket: the replica is a base snapshot plus the segments layered on it,
# and an age-based deletion rule will happily remove a base that current segments
# still depend on, so the restore fails exactly when it is needed.

# sync-interval is stated explicitly because it is the ONLY thing protecting data here,
# not a tuning knob. Measured 2026-08-10: a write made immediately before a graceful stop
# is LOST. Tested four ways — SIGKILL, SIGTERM with a 10s grace, SIGTERM with a 30s grace,
# and SIGTERM with shutdown-sync-timeout/shutdown-sync-interval configured — all four lost
# it. The control (same write, 15s wait, then SIGTERM) survived. So durability comes
# entirely from this periodic sync during normal running; nothing at shutdown rescues a
# write that has not already been replicated.
sync-interval: 1s

# The replica path is versioned, and bumping it is the supported way to start from an
# empty database. Deleting objects under the old path is NOT equivalent: during a
# deploy the outgoing revision is still replicating, so a delete races it and the old
# state comes straight back.
#
# Bumped to v2 on 2026-08-10. The seeder became marker-based (seed.started /
# seed.completed in service_state) while the replica still held a database seeded by
# the older "are there any plans?" inference. The new seeder saw no completion marker,
# tried to seed a database that already had rows, failed partway, and left a started
# marker behind — after which every boot refused to start, by design. Starting from an
# empty replica lets the seeder write its dataset in time order, which is the only way
# a backdated history can be written at all.
dbs:
  - path: /data/entitlement.db
    replica:
      type: gs
      bucket: $LITESTREAM_BUCKET
      path: entitlement-v2
