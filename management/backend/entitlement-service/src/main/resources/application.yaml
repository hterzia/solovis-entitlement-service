server:
  port: 8081
  address: 0.0.0.0

spring:
  application:
    name: entitlement-service
  flyway:
    enabled: true
    # SQL migrations only. V5 is Java — it rebuilds audit_event to widen a CHECK, which needs
    # PRAGMA foreign_keys=OFF, which SQLite ignores inside a transaction, so it opts out of
    # Flyway's. It reaches Flyway as a @Component: Boot collects JavaMigration beans and hands
    # them over, which works regardless of what package it sits in.
    locations: classpath:db/migration
  jackson:
    default-property-inclusion: non_null

entitlement:
  clock:
    # One zone for the whole service. Dates an operator types mean this zone and no other.
    # Must be a zone whose midnight is unambiguous — asserted at startup (ServiceZone).
    zone: "${ENTITLEMENT_CLOCK_ZONE:America/New_York}"
  ask:
    # Blank api-key ⇒ no interpreter bean ⇒ /check/ask answers 503 ⇒ askEnabled: false.
    # Loaded from the repo-root .env, never committed.
    api-key: "${GOOGLE_AI_GEMINI_API_KEY:}"
    model: gemini-3.5-flash-lite
    timeout: 5s
  database:
    path: "${ENTITLEMENT_DB_PATH:./data/entitlement.db}"
    write-pool-size: 1
    read-pool-size: 4
    busy-timeout-millis: 5000
  actor:
    id: "${ENTITLEMENT_DEV_ACTOR:dev-operator}"
  seed:
    enabled: "${ENTITLEMENT_SEED_ENABLED:false}"
  snapshot:
    # snapshot-feed.md: a replica asking for a version older than this is told to full-resync.
    # Seven days is generous enough that a consuming service can be down for a long weekend and
    # still catch up by delta.
    delta-retention: 7d
    prune-interval: 1h
    prune-enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
