server:
  port: 8081
  address: 0.0.0.0

spring:
  application:
    name: entitlement-service
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    default-property-inclusion: non_null

entitlement:
  database:
    path: "${ENTITLEMENT_DB_PATH:./data/entitlement.db}"
    write-pool-size: 1
    read-pool-size: 4
    busy-timeout-millis: 5000
  actor:
    id: "${ENTITLEMENT_DEV_ACTOR:dev-operator}"
  seed:
    enabled: "${ENTITLEMENT_SEED_ENABLED:true}"

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
