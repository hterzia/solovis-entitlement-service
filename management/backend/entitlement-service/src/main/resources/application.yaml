server:
  port: 8081
  address: 0.0.0.0

spring:
  application:
    name: entitlement-service
  datasource:
    url: "jdbc:sqlite:${ENTITLEMENT_DB_PATH:./data/entitlement.db}?journal_mode=WAL&synchronous=NORMAL&foreign_keys=on&busy_timeout=5000&temp_store=MEMORY"
    driver-class-name: org.sqlite.JDBC
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    default-property-inclusion: non_null

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
