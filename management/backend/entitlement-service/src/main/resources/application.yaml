server:
  port: 8081
  address: 0.0.0.0

spring:
  application:
    name: entitlement-service
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    default-property-inclusion: non_null

entitlement:
  database:
    path: "${ENTITLEMENT_DB_PATH:./data/entitlement.db}"
    write-pool-size: 1
    read-pool-size: 4
    busy-timeout-millis: 5000
  actor:
    id: "${ENTITLEMENT_DEV_ACTOR:dev-operator}"
  seed:
    enabled: "${ENTITLEMENT_SEED_ENABLED:false}"
  snapshot:
    # snapshot-feed.md: a replica asking for a version older than this is told to full-resync.
    # Seven days is generous enough that a consuming service can be down for a long weekend and
    # still catch up by delta.
    delta-retention: 7d
    prune-interval: 1h
    prune-enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
